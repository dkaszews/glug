name: Docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build/css build/docs
      - uses: actions/cache@v4
        id: doxygen-awesome-css-cache
        with:
          path: build/css
          key: doxygen-awesome-css-v2.4.2
      - run: wget https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/refs/tags/v2.4.2/doxygen-awesome.css -O build/css/doxygen-awesome.css
        if: steps.doxygen-awesome-css-cache.outputs.cache-hit != 'true'
      - uses: mattnotmitt/doxygen-action@edge
        with:
          doxyfile-path: .doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build/docs
      - uses: pavi2410/html-preview-action@v5
        id: html-preview
        with:
          html_file: index.html
          site_root: build/docs/html
      - run: echo ${{ steps.html-preview.outputs.url }}
