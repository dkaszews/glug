name: Docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: doxygen
          version: 1.0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          cache: pip
      - run: pip install -r requirements.txt
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '>=3.0.1'
          actions-cache-folder: .xmake-cache
          package-cache: true
          package-cache-key: ubuntu-latest.static.release.stl
          project-path: glug
      - run: xmake config -vy
      - run: xmake project -k compile_commands
      - run: xmake docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build/docs

